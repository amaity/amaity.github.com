<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — avamaity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Barlow+Condensed:wght@700&family=Lora:wght@400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Lora', Georgia, serif;
            background: #0F0E0A;
            color: #7A6E5F;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 480px;
            width: 100%;
            position: relative;
        }
        .ghost-number {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(6rem, 20vw, 10rem);
            color: #E07B39;
            opacity: 0.18;
            line-height: 1;
            margin-bottom: -1.5rem;
            letter-spacing: -0.04em;
            user-select: none;
        }
        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #F5F0E8;
            margin-bottom: 1rem;
        }
        p {
            font-family: 'Lora', Georgia, serif;
            color: #7A6E5F;
            margin-bottom: 0.75rem;
            line-height: 1.7;
            font-size: 0.9375rem;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 1.5rem;
            color: #7A6E5F;
            font-size: 0.9rem;
        }
        ul li::before {
            content: '— ';
            color: #E07B39;
        }
        a {
            color: #E07B39;
            text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        a:hover {
            color: #F5F0E8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ghost-number">404</div>
        <h1>Page not found</h1>
        <p>Sorry, the page you were looking for does not exist.</p>
        <p>It may be the result of:</p>
        <ul>
            <li>a mistyped address</li>
            <li>an out-of-date link</li>
        </ul>
        <p><a href="/">Go back home</a></p>
    </div>
</body>
</html>
